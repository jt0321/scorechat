[project]
name = "scorechat"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Score analysis
    "music21>=9.1.0",
    # Embeddings + LLM
    "openai>=1.30.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    # Database
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    # Rendering & Conversion
    # <6.3: 6.3.0 stopped writing @accid.ges in its MEI, and music21 needs it --
    # it does not apply a key signature itself -- so the Verovio fallback for
    # truncated parses loses every signature accidental (Op. 31 No. 3/i: 362
    # E-flats read as E). tests/test_harmony.py's Op. 31 No. 3 cases catch it.
    "verovio>=3.15.0,<6.3",
    # Utilities
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# Model providers — install whichever CHAT_PROVIDER you set (see .env.example).
# openrouter and cloudflare need nothing extra: both are OpenAI-compatible endpoints.
anthropic = ["langchain-anthropic>=0.3.0"]
ollama    = ["langchain-ollama>=0.3.0"]
gemini    = ["langchain-google-genai>=2.0.0"]
dev       = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]

[project.scripts]
ingest-scores              = "ingest_scores:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analysis", "commentary", "db", "pipeline", "frontend"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
