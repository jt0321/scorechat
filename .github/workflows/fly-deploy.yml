# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
#
# Every push to main is tested, then deployed. The deploy waits on the tests,
# so a red suite never reaches the public URL.

name: Test and deploy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    # An empty database with the schema applied: what "corpus not ingested"
    # looks like, so the corpus-backed tests skip and everything else runs.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: scorechat
          POSTGRES_USER: scorechat
          POSTGRES_PASSWORD: scorechat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scorechat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://scorechat:scorechat@localhost:5432/scorechat
    steps:
      - uses: actions/checkout@v4
        with:
          # The .krn sources: parsing and numbering tests run against them.
          submodules: true
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # the runtime image's version
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/schema.sql
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - run: .venv/bin/pytest -q

  deploy:
    name: Deploy app
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-group    # one deploy at a time; a newer push waits its turn
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --ha=false: a demo wants one machine, not the default pair.
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
