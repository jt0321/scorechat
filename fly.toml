# fly.toml app configuration file generated for scorechat on 2026-09-20T22:43:50Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'scorechat'
primary_region = 'iad'

[build]
[env]
  ALLOWED_CHAT_PROVIDERS = 'gemini,openrouter'
  ASK_RATE_LIMIT = '20'
  ASK_RATE_WINDOW = '3600'
  PORT = '8080'
  TRUST_PROXY = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/api/works'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
