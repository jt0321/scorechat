# sources/manifest.toml
#
# The commentary texts ScoreChat reads, and where in each one every sonata is
# discussed. The texts themselves are NOT in this repository: `fetch_sources.py`
# downloads them into data/sources/ (gitignored) and refuses any file whose
# sha256 differs from the one pinned here, so every line and leaf number below
# refers to exactly one version of each text.
#
# Sections
# --------
# A section runs from its start to the next section's start. Text before the
# first section is not ingested (title pages, contents -- a table of contents
# names every opus and would read as mentions of all of them).
#
#   sonatas = [14]     the section is *declared* to discuss these sonatas, by
#                      catalogue number (works.work_number), not opus string.
#                      Passages inherit the declaration and are then checked
#                      against what they actually name.
#   sonatas = []       nothing is declared: passages are anchored only by what
#                      they name (an opus, a nickname), or not at all.
#   include = false    the section is skipped entirely.
#
# `heading` is the heading as the OCR renders it, typos included ("OP. loi" is
# Op. 101), matched ignoring whitespace. It is how a reviewer checks the table
# against the scan, and how the ingest finds where on the page a section
# starts when two share a page.
#
# Pages
# -----
# `leaf` is the scan's page index and what an archive.org link opens
# (…/page/n{leaf}); `page` is the number printed on it. archive.org's own
# page-number detection runs one behind the printed numbers in the Marx volume,
# which `page_offset` corrects and the ingest verifies against the running
# heads.

