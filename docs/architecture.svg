<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="'DejaVu Sans',Verdana,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6673"/>
    </marker>
  </defs>

  <rect width="1240" height="790" fill="#f5f6f7"/>

  <text x="40" y="52" font-size="26" font-weight="bold" fill="#131a22">ScoreChat — symbolic score analysis</text>
  <text x="40" y="78" font-size="15" fill="#5a6673">The score is the source of musical truth. Every derived pass runs from the database alone; the model reads stored analysis and writes none.</text>

  <!-- ============ source ============ -->
  <rect x="40" y="108" width="300" height="60" rx="5" fill="#131a22"/>
  <text x="60" y="134" font-size="16" font-weight="bold" fill="#ffffff">Humdrum .krn</text>
  <text x="60" y="155" font-size="13" fill="#b9c3cd">103 movements · 32 sonatas</text>

  <!-- ============ two readers ============ -->
  <text x="40" y="212" font-size="12" font-weight="bold" fill="#78889a" letter-spacing="1.6">TWO READERS OF THE SAME FILE</text>

  <rect x="40" y="226" width="560" height="84" rx="5" fill="#ffffff" stroke="#c9d2da"/>
  <text x="60" y="252" font-size="15" font-weight="bold" fill="#131a22">music21 — load_score()</text>
  <text x="60" y="274" font-size="13" fill="#4a5866">notes, durations, ties, voices, meter</text>
  <text x="60" y="295" font-size="12" font-style="italic" fill="#8a6014">falls back to Verovio/humlib where it truncates — 4 of 103</text>

  <rect x="640" y="226" width="560" height="84" rx="5" fill="#ffffff" stroke="#c9d2da"/>
  <text x="660" y="252" font-size="15" font-weight="bold" fill="#131a22">analysis/humdrum.py — direct, spine-aware</text>
  <text x="660" y="274" font-size="13" fill="#4a5866">declared key (*f:) · sections (*&gt;[A,A,B]) · **dynam</text>
  <text x="660" y="295" font-size="12" font-style="italic" fill="#2c6440">read from the raw source, bypassing the parse</text>

  <path d="M190 168 L190 190 L920 190" fill="none" stroke="#5a6673" stroke-width="1.6"/>
  <line x1="430" y1="190" x2="430" y2="222" stroke="#5a6673" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="920" y1="190" x2="920" y2="222" stroke="#5a6673" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ============ canonical layer ============ -->
  <text x="40" y="352" font-size="12" font-weight="bold" fill="#78889a" letter-spacing="1.6">CANONICAL LAYER — POSTGRES</text>

  <rect x="40" y="366" width="1160" height="96" rx="5" fill="#eef1f4" stroke="#c9d2da"/>
  <rect x="58" y="384" width="356" height="60" rx="4" fill="#ffffff" stroke="#c9d2da"/>
  <text x="76" y="408" font-size="14" font-weight="bold" fill="#131a22">score_sources</text>
  <text x="76" y="430" font-size="12" fill="#4a5866">raw .krn + SHA-256 — every pass re-reads it</text>

  <rect x="442" y="384" width="356" height="60" rx="4" fill="#ffffff" stroke="#c9d2da"/>
  <text x="460" y="408" font-size="14" font-weight="bold" fill="#131a22">score_measures</text>
  <text x="460" y="430" font-size="12" fill="#4a5866">symbolic_data (JSONB) · numbering · role</text>

  <rect x="826" y="384" width="356" height="60" rx="4" fill="#ffffff" stroke="#c9d2da"/>
  <text x="844" y="408" font-size="14" font-weight="bold" fill="#131a22">measure_analyses</text>
  <text x="844" y="430" font-size="12" fill="#4a5866">versioned facts: keys · chords · directions</text>

  <line x1="430" y1="310" x2="430" y2="362" stroke="#5a6673" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="920" y1="310" x2="920" y2="362" stroke="#5a6673" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ============ derived passes ============ -->
  <text x="40" y="504" font-size="12" font-weight="bold" fill="#78889a" letter-spacing="1.6">DERIVED PASSES — FROM THE DATABASE ALONE, RE-RUNNABLE WITHOUT RE-INGESTING</text>

  <rect x="40" y="532" width="275" height="78" rx="5" fill="#ffffff" stroke="#34417f" stroke-width="1.5"/>
  <text x="58" y="558" font-size="14" font-weight="bold" fill="#34417f">numbering</text>
  <text x="58" y="580" font-size="12" fill="#4a5866">which measures are bars</text>
  <text x="58" y="600" font-size="11" fill="#78889a">renumber_measures.py</text>

  <rect x="335" y="532" width="275" height="78" rx="5" fill="#ffffff" stroke="#34417f" stroke-width="1.5"/>
  <text x="353" y="558" font-size="14" font-weight="bold" fill="#34417f">harmony</text>
  <text x="353" y="580" font-size="12" fill="#4a5866">key trajectory · chords</text>
  <text x="353" y="600" font-size="11" fill="#78889a">build_harmony.py</text>

  <rect x="630" y="532" width="275" height="78" rx="5" fill="#ffffff" stroke="#34417f" stroke-width="1.5"/>
  <text x="648" y="558" font-size="14" font-weight="bold" fill="#34417f">sections</text>
  <text x="648" y="580" font-size="12" fill="#2c6440">engraved repeat scheme</text>
  <text x="648" y="600" font-size="11" fill="#78889a">build_sections.py</text>

  <rect x="925" y="532" width="275" height="78" rx="5" fill="#ffffff" stroke="#34417f" stroke-width="1.5"/>
  <text x="943" y="558" font-size="14" font-weight="bold" fill="#34417f">relations</text>
  <text x="943" y="580" font-size="12" fill="#4a5866">repeats / varies between spans</text>
  <text x="943" y="600" font-size="11" fill="#78889a">build_relations.py</text>

  <path d="M700 462 L700 512 L177 512" fill="none" stroke="#5a6673" stroke-width="1.6"/>
  <path d="M700 512 L1062 512" fill="none" stroke="#5a6673" stroke-width="1.6"/>
  <line x1="177" y1="512" x2="177" y2="528" stroke="#5a6673" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="472" y1="512" x2="472" y2="528" stroke="#5a6673" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="767" y1="512" x2="767" y2="528" stroke="#5a6673" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="1062" y1="512" x2="1062" y2="528" stroke="#5a6673" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ============ answering ============ -->
  <text x="40" y="638" font-size="12" font-weight="bold" fill="#78889a" letter-spacing="1.6">ANSWERING</text>

  <rect x="40" y="652" width="360" height="84" rx="5" fill="#ffffff" stroke="#c9d2da"/>
  <text x="58" y="678" font-size="14" font-weight="bold" fill="#131a22">pipeline/analysis_api.py</text>
  <text x="58" y="700" font-size="12" fill="#4a5866">six plain functions over stored analysis</text>
  <text x="58" y="721" font-size="11" fill="#78889a">testable without a model</text>

  <rect x="440" y="652" width="360" height="84" rx="5" fill="#ffffff" stroke="#c9d2da"/>
  <text x="458" y="678" font-size="14" font-weight="bold" fill="#131a22">pipeline/tools.py</text>
  <text x="458" y="700" font-size="12" font-style="italic" fill="#8a6014">the six bound as LLM tools — the trace is the citation</text>
  <text x="458" y="721" font-size="11" fill="#78889a">ask.py · GET /api/ask · web client</text>

  <rect x="840" y="652" width="360" height="84" rx="5" fill="#ffffff" stroke="#c9d2da"/>
  <text x="858" y="678" font-size="14" font-weight="bold" fill="#131a22">MEI via Verovio</text>
  <text x="858" y="700" font-size="12" fill="#4a5866">exact notation for a cited bar range</text>
  <text x="858" y="721" font-size="11" fill="#78889a">notation viewer</text>

  <line x1="220" y1="610" x2="220" y2="648" stroke="#5a6673" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="400" y1="694" x2="436" y2="694" stroke="#5a6673" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="800" y1="694" x2="836" y2="694" stroke="#5a6673" stroke-width="1.6" marker-end="url(#a)"/>

  <text x="40" y="768" font-size="12" fill="#5a6673">evaluate_form.py scores what is stored against ten independently known movements — 49/50 at a four-bar tolerance. The older pgvector path (/api/chat) is unused by the clients.</text>
</svg>
